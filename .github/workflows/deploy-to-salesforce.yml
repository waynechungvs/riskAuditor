name: Deploy to Salesforce

on:
  workflow_dispatch:
    inputs:
      target_org:
        description: 'Target Org (SIT, UAT, PROD)'
        required: true
        default: 'SIT'
        type: choice
        options: [SIT, UAT, PROD]
      validate_only:
        description: 'Only Validate? (true = dry run)'
        required: true
        default: 'true'
        type: choice
        options: [true, false]
      test_level:
        description: 'Test Level'
        required: true
        default: 'NoTestRun'
        type: choice
        options: [NoTestRun, RunLocalTests, RunAllTestsInOrg, RunSpecifiedTests]
      test_classes:
        description: 'Test Class names (comma-separated)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        uses: sfdx-actions/setup-sfdx@v1

      - name: Authenticate with Salesforce Org
        run: |
          echo "${{ secrets[format('{0}_ORG_SFDX_URL', github.event.inputs.target_org)] }}" > auth_url.txt
          sf org login sfdx-url --sfdx-url-file auth_url.txt --alias targetOrg --set-default

      - name: Determine project type and deploy
        run: |
          echo "Checking deployment structure..."
          
          if [ -f "scripts/package.xml" ]; then
            echo "Detected metadata format. Deploying with package.xml..."
            sf project deploy start --metadata-dir scripts --target-org targetOrg \
              --test-level ${{ github.event.inputs.test_level }} \
              $([ "${{ github.event.inputs.validate_only }}" == "true" ] && echo "--dry-run") \
              $([ "${{ github.event.inputs.test_level }}" == "RunSpecifiedTests" ] && echo "--tests ${{ github.event.inputs.test_classes }}")
          
          elif [ -d "force-app" ]; then
            echo "Detected SFDX format. Deploying source..."
            sf project deploy start --source-dir force-app --target-org targetOrg \
              --test-level ${{ github.event.inputs.test_level }} \
              $([ "${{ github.event.inputs.validate_only }}" == "true" ] && echo "--dry-run") \
              $([ "${{ github.event.inputs.test_level }}" == "RunSpecifiedTests" ] && echo "--tests ${{ github.event.inputs.test_classes }}")
          
          else
            echo "❌ No recognizable deployment structure found. Aborting."
            exit 1
          fi

