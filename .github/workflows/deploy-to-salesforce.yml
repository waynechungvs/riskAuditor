name: Deploy to Salesforce

on:
  workflow_dispatch:
    inputs:
      target_org:
        description: 'Target Org (SIT, UAT, PROD)'
        required: true
        default: 'SIT'
        type: choice
        options: [SIT, UAT, PROD]

      deploy_type:
        description: 'Deploy Type'
        required: true
        default: 'packageXml'
        type: choice
        options: [packageXml, sourceFolder, metadataApiFolder]

      validate_only:
        description: 'Only Validate? (true = dry run)'
        required: true
        default: 'true'
        type: choice
        options: [true, false]

      test_level:
        description: 'Test Level'
        required: true
        default: 'NoTestRun'
        type: choice
        options: [NoTestRun, RunLocalTests, RunAllTestsInOrg, RunSpecifiedTests]

      test_classes:
        description: 'Test Class names (comma-separated)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup SFDX CLI
        uses: sfdx-actions/setup-sfdx@v1

      - name: Get Auth URL
        id: auth
        run: |
          case "${{ github.event.inputs.target_org }}" in
            SIT)
              echo "AUTH_URL=${{ secrets.SFDX_SIT_URL }}" >> $GITHUB_OUTPUT
              ;;
            UAT)
              echo "AUTH_URL=${{ secrets.SFDX_UAT_URL }}" >> $GITHUB_OUTPUT
              ;;
            PROD)
              echo "AUTH_URL=${{ secrets.SFDX_PROD_URL }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Unsupported target_org: ${{ github.event.inputs.target_org }}"
              exit 1
              ;;
          esac

      - name: Authenticate to Org
        run: |
          echo "${{ steps.auth.outputs.AUTH_URL }}" > auth_url.txt
          sfdx auth:sfdxurl:store -f auth_url.txt -a ci-org

      - name: Deploy to Salesforce
        run: |
          DEPLOY_TYPE="${{ github.event.inputs.deploy_type }}"
          TEST_LEVEL="${{ github.event.inputs.test_level }}"
          VALIDATE_ONLY="${{ github.event.inputs.validate_only }}"
          TEST_CLASSES="${{ github.event.inputs.test_classes }}"

          ARGS=""
          if [[ "$VALIDATE_ONLY" == "true" ]]; then
            ARGS="$ARGS --checkonly"
          fi

          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -n "$TEST_CLASSES" ]]; then
            ARGS="$ARGS --testlevel RunSpecifiedTests --runtests $TEST_CLASSES"
          else
            ARGS="$ARGS --testlevel $TEST_LEVEL"
          fi

          echo "Deploy Type: $DEPLOY_TYPE"
          echo "Validate only: $VALIDATE_ONLY"
          echo "Test Level: $TEST_LEVEL"

          if [[ "$DEPLOY_TYPE" == "packageXml" ]]; then
            if [[ -f "scripts/package.xml" ]]; then
              sfdx force:source:deploy -u ci-org -x scripts/package.xml $ARGS
            else
              echo "❌ scripts/package.xml not found"
              exit 1
            fi

          elif [[ "$DEPLOY_TYPE" == "sourceFolder" ]]; then
            if [[ -d "force-app" ]]; then
              sfdx force:source:deploy -u ci-org -p force-app $ARGS
            else
              echo "❌ force-app folder not found"
              exit 1
            fi

          elif [[ "$DEPLOY_TYPE" == "metadataApiFolder" ]]; then
            if [[ -d "metadata" ]]; then
              sfdx force:mdapi:deploy -u ci-org -d metadata -w 100 $ARGS
            else
              echo "❌ metadata folder not found"
              exit 1
            fi

          else
            echo "❌ Unsupported deploy_type: $DEPLOY_TYPE"
            exit 1
          fi


